---
- name: Ensure docker-compose is installed
  ansible.builtin.dnf:
    name: docker-compose-plugin 
    state: present 

- name: Ensure docker service is running
  ansible.builtin.systemd:
    name: docker 
    state: started 
    enabled: true 

- name: Setup Portainer directory
  ansible.builtin.file:
    path: /home/bpadair/docker-compose/portainer 
    state: directory 
    mode: '0755'
    owner: bpadair 
    group: bpadair 

- name: Deploy Portainer using Docker compose 
  ansible.builtin.template:
    src: docker_compose.yml.j2 
    dest: /home/bpadair/docker-compose/portainer/docker-compose.yml 
    mode: '0755'
    owner: bpadair 
    group: bpadair 
  notify:
    - Start Portainer 

- name: Ensure portainer is started 
  community.docker.docker_compose_v2:
    project_src: /home/bpadair/docker-compose/portainer 
    state: present
