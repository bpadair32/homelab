---
- name: Ensure that podman is uninstalled
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: absent
  with_items:
    - podman
    - buidah

- name: Ensure that yum-utils is installed
  ansible.builtin.dnf:
    name: yum-utils
    state: present

- name: Add the Docker repo
  ansible.builtin.command:
    cmd: dnf config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo
  notify: Refresh metadata

- name: Install Docker and associated packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-compose-plugin

- name: Ensure that the Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
