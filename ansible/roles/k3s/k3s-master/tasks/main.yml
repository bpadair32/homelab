---
- name: Copy k3s service file
  register: k3s_service
  template:
    src: "k3s.service.j2"
    dest: "{{ system_dir }}/k3s.service"
    owner: root
    group: root
    mode: 0644

- name: Enable and check the K3s service
  systemd:
    name: k3s
    daemon_reload: yes
    state: restarted
    enabled: yes

- name: Wait for node-token
  wait_for:
    path: "{{ k3s_server_location }}/server/node-token"

- name: Register node token mode
  stat:
    path: "{{ k3s_server_location }}/server/node-token"
  register: node-token

- name: Allow node token reading
  file:
    path: "{{ k3s_server_location }}/server/node-token"
    mode: "g+rx,o+rx"

- name: Read token
  slurp:
    path: "{{ k3s_server_location }}/server/node-token"
  register: t

- name: Store token
  set_fact:
    token: "{{ t.content | b64decode | regex_replace('\n', '') }}"

- name: Restore node token mode
  file:
    path: "{{ k3s_server_location }}/server/node-token }}"
    mode: "{{ node-token.stat.mode }}"

- name: Create kube directory
  file:
    path: ~{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    mode: 0750

- name: Copy config
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~{{ ansible_user }}/.kube/config
    remote_src: yes
    owner: "{{ ansible_user }}"
    mode: 0750

- name: Replaces localhost
  command: >-
    /usr/local/bin/k3s kubectl config set-cluster default
      --server=https://{{ master_ip }}:6443
      --kubeconfig ~{{ ansible_user }}/.kube/config
  changed_when: true

- name: Symlink kubectl
  file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link

- name: Symlink crictl
  file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/crictl
    state: link
