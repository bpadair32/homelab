---
- hosts: k3s_node
  gather_facts: true
  become: false
  tasks:
    - name: Check if k3s is already installed #This is how we will get idempotency
      ansible.builtin.command: ls /etc/rancher/k3s
      register: k3s
      changed_when: false
      ignore_errors: true

    - name: Stop and disable firewalld #K3s does not like firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
        masked: true

    - name: Download and install K3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode=644" K3S_TOKEN=k3s_token sh -s - server --server "https://{{ k3s_master_ip }}:6443"
      when:
        - k3s is failed

    - name: Start and enable K3s
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
