services:
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    init: true
    restart: always
    container_name: nextcloud-aio-mastercontainer
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config 
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nextcloud-aio
    ports:
      - 0.0.0.0:8080:8080
    environment:
      APACHE_PORT: 11000
      APACHE_IP_BINDING: 127.0.0.1
      SKIP_DOMAIN_VALIDATION: true
      NEXTCLOUD_DATADIR: /var/lib/nextcloud
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    environment:
      NC_DOMAIN: office.hyena-banded.ts.net 
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
      - type: volume 
        source: caddy_certs
        target: /certs
      - type: volume 
        source: caddy_data
        target: /data
      - type: volume 
        source: caddy_config
        target: /config 
      - type: volume 
        source: tailscale_sock
        target: /var/run/tailscale
        read_only: true
    network_mode: service:tailscale
  tailscale:
    image: tailscale/tailscale:latest
    environment:
      TS_HOSTNAME: office
      TS_AUTH_KEY: tskey-client-k1fubtQYpD11CNTRL-c4Qam4wQ58BYVVmKhhCJ9BDvTCdrqQHY
      TS_EXTRA_ARGS: --advertise-tags=tag:nextcloud
    init: true
    restart: unless-stopped
    volumes:
      - /dev/net/tun:/dev/net/tun
    - type: volume 
      source: tailscale
      target: /var/lib/tailscale
    - type: volume 
      source: tailscale_sock
      target: /tmp 
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - nextcloud-aio
volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
  caddy_certs:
    name: caddy_certs
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  tailscale:
    name: tailscale
  tailscale_sock:
    name: tailscale_sock
networks:
  nextcloud-aio:
    name: nextcloud-aio
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.driver.mtu: "9001"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
