version: "3.3"
services:
  stirling-pdf:
    container_name: stirling-pdf
    image: frooodle/s-pdf:latest
    volumes:
      - /usr/share/trainingData/eng.traineddata:/usr/share/tesseract-ocr/4.00/tessdata
    environment:
      APP_LOCALE: en_US
      APP_HOME_NAME: PDF Editor
      APP_HOME_DESCRIPTION: ""
      APP_NAVBAR_NAME: Stirling PDF
      APP_ROOT_PATH: /
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
  tailscale:
    hostname: stirling-pdf
    image: tailscale/tailscale:latest
    healthcheck:
      test: ["CMD-SHELL", "tailscale status"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - "./tailscale_var_lib:/var/lib"
      - "/dev/net/tun:/dev/net/tun"
    cap_add:
      - net_admin
      - sys_module
      - net_raw
    command: tailscaled
