---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: adair-cloud-issuer
spec:
  acme:
    email: bradadair@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: adair-cloud-acme-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
