---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-ui-cert
  namespace: longhorn-system
spec:
  secretName: longhorn-ui-tls
  renewBefore: 240h
  duration: 2160h
  commonName: longhorn.adair.cloud
  dnsNames:
    - longhorn.adair.cloud
  issuerRef:
    name: adair-cloud-issuer
    kind: ClusterIssuer
