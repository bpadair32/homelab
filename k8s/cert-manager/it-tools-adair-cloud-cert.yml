---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: it-tools-cert
  namespace: basic-apps
spec:
  secretName: it-tools-tls
  renewBefore: 240h
  duration: 2160h
  commonName: it-tools.adair.cloud
  dnsNames:
    - it-tools.adair.cloud
  issuerRef:
    name: adair-cloud-issuer
    kind: ClusterIssuer
