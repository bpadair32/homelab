---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-ui-cert
  namespace: auth
spec:
  secretName: auth-ui-tls
  renewBefore: 240h
  duration: 2160h
  commonName: auth.adair.cloud
  dnsNames:
    - auth.adair.cloud
  issuerRef:
    name: adair-cloud-issuer
    kind: ClusterIssuer
