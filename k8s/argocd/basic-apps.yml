---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: basic-apps
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: git@github.com:bpadair32/homelab.git
    targetRevision: HEAD
    path: k8s/basic-apps/
  destination:
    server: https://kubernetes.default.svc
    namespace: basic-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
